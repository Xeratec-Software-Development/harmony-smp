apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: harmony-smp-ingress
  namespace: harmony-smp
  labels:
    app: harmony-smp
  annotations:
    # For nginx ingress controller
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Uncomment for cert-manager TLS
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # kubernetes.io/tls-acme: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: harmony-smp.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: harmony-smp
                port:
                  number: 8084
  # Uncomment for TLS/HTTPS
  # tls:
  # - hosts:
  #   - harmony-smp.yourdomain.com
  #   secretName: harmony-smp-tls
